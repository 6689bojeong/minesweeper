<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 강아지 지뢰찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 자연 느낌의 초록색 그라데이션 배경 */
            background: linear-gradient(135deg, #2d5a27 0%, #1e3a1a 100%);
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
        }
        .cell {
            width: 34px;
            height: 34px;
            transition: all 0.2s;
        }
        .cell.unrevealed {
            /* 풀밭 느낌의 진한 초록색 */
            background-color: #4c7c44;
            border: 2px solid #3d6337;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
        }
        .cell.unrevealed:hover {
            background-color: #5e9255;
            cursor: pointer;
            transform: translateY(-1px);
        }
        .cell.revealed {
            /* 흙바닥 느낌의 밝은 브라운/베이지 */
            background-color: #d2b48c;
            border: 1px solid #bc9d7a;
            color: #4a3728;
        }
        .cell.mine {
            background-color: #ff6b6b !important;
            animation: pop 0.3s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        /* 숫자 색상을 흙 배경에서 잘 보이도록 조정 */
        .number-1 { color: #1e40af; }
        .number-2 { color: #166534; }
        .number-3 { color: #991b1b; }
        .number-4 { color: #6b21a8; }
        .number-5 { color: #854d0e; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .character-bounce {
            animation: bounce 2s infinite ease-in-out;
        }
        
        .modal {
            background: rgba(20, 40, 20, 0.9);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header & Dog Character -->
    <div class="flex flex-col items-center mb-6">
        <div class="text-7xl mb-2 character-bounce">🐶</div>
        <div id="cheer-bubble" class="bg-white text-green-900 px-5 py-2 rounded-2xl relative mb-4 font-bold text-sm shadow-xl">
            멍멍! 내가 도와줄게! 화난 친구들을 조심해!
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-white"></div>
        </div>
        <h1 class="text-4xl font-black text-yellow-300 mb-2 drop-shadow-md">GRASSY MINES</h1>
    </div>

    <!-- Stats Bar -->
    <div class="flex gap-6 mb-4 bg-green-900/60 p-4 rounded-2xl border border-green-700/50 w-full max-w-md justify-around shadow-2xl">
        <div class="text-center">
            <p class="text-xs text-green-200">남은 지뢰</p>
            <p id="mine-count" class="text-2xl font-bold text-orange-400">10</p>
        </div>
        <div class="text-center">
            <p class="text-xs text-green-200">시간</p>
            <p id="timer" class="text-2xl font-bold">000</p>
        </div>
        <div class="text-center">
            <p class="text-xs text-green-200">남은 힌트</p>
            <p id="hint-count" class="text-2xl font-bold text-sky-300">5</p>
        </div>
    </div>

    <!-- Game Board -->
    <div id="board" class="grid gap-1.5 p-3 bg-green-800/80 border-8 border-green-900 rounded-2xl shadow-2xl"></div>

    <!-- Controls -->
    <div class="mt-8 flex gap-4">
        <button onclick="useHint()" id="hint-btn" class="bg-sky-500 hover:bg-sky-400 text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2">
            <span>🔍</span> 멍멍 힌트
        </button>
        <button onclick="initGame()" class="bg-yellow-400 hover:bg-yellow-300 text-green-900 px-8 py-3 rounded-full font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2">
            <span>🔄</span> 다시 놀기
        </button>
    </div>

    <!-- Game Over Modal -->
    <div id="modal" class="hidden fixed inset-0 modal flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-[2rem] border-4 border-yellow-400 text-center max-w-sm mx-4 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <div id="modal-icon" class="text-7xl mb-4"></div>
            <h2 id="modal-title" class="text-3xl font-bold mb-4 text-green-900">결과</h2>
            <p id="modal-msg" class="text-green-800 mb-6 font-medium whitespace-pre-line"></p>
            <button onclick="initGame()" class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl hover:bg-green-500 transition-colors shadow-lg">
                다시 시작하기!
            </button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        const MINE_COUNT = 10;
        let board = [];
        let revealedCount = 0;
        let hintsLeft = 5;
        let timer = 0;
        let timerInterval;
        let gameActive = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playTone(800, 'sine', 0.1),
            reveal: () => playTone(1200, 'sine', 0.05),
            mine: () => {
                playTone(150, 'sawtooth', 0.6);
                playTone(100, 'sawtooth', 0.4);
            },
            win: () => {
                [523, 659, 783, 1046].forEach((f, i) => {
                    setTimeout(() => playTone(f, 'square', 0.2), i * 100);
                });
            },
            hint: () => playTone(950, 'triangle', 0.3)
        };

        const cheerMessages = [
            "멍멍! 잘하고 있어!",
            "냄새가 나... 여기인가?!",
            "조심조심! 화난 친구가 있어!",
            "거의 다 찾았어! 멍멍!",
            "넌 정말 똑똑한 강아지 같아!",
            "힌트가 필요하면 멍! 하고 눌러!",
            "풀밭 아래를 잘 살펴봐!"
        ];

        function setCheer(msg) {
            const bubble = document.getElementById('cheer-bubble');
            bubble.innerText = msg;
        }

        function initGame() {
            clearInterval(timerInterval);
            gameActive = true;
            revealedCount = 0;
            hintsLeft = 5;
            timer = 0;
            board = [];
            
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('timer').innerText = "000";
            document.getElementById('hint-count').innerText = hintsLeft;
            document.getElementById('mine-count').innerText = MINE_COUNT;
            setCheer("새로운 모험 시작! 멍멍!");

            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.innerHTML = '';

            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    board[r][c] = {
                        r, c,
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        neighborCount: 0
                    };
                    const cellEl = document.createElement('div');
                    cellEl.id = `cell-${r}-${c}`;
                    cellEl.className = 'cell unrevealed rounded-lg flex items-center justify-center font-bold text-lg';
                    cellEl.onclick = () => handleCellClick(r, c);
                    cellEl.oncontextmenu = (e) => {
                        e.preventDefault();
                        toggleFlag(r, c);
                    };
                    boardEl.appendChild(cellEl);
                }
            }

            let minesPlaced = 0;
            while (minesPlaced < MINE_COUNT) {
                let r = Math.floor(Math.random() * BOARD_SIZE);
                let c = Math.floor(Math.random() * BOARD_SIZE);
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborCount = count;
                }
            }

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer.toString().padStart(3, '0');
                if(timer % 15 === 0) setCheer(cheerMessages[Math.floor(Math.random() * cheerMessages.length)]);
            }, 1000);
        }

        function handleCellClick(r, c) {
            if (!gameActive || board[r][c].revealed || board[r][c].flagged) return;

            if (board[r][c].isMine) {
                gameOver(false);
                return;
            }

            revealCell(r, c);
            sounds.reveal();

            if (revealedCount === BOARD_SIZE * BOARD_SIZE - MINE_COUNT) {
                gameOver(true);
            }
        }

        function revealCell(r, c) {
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE || board[r][c].revealed || board[r][c].flagged) return;

            board[r][c].revealed = true;
            revealedCount++;
            const el = document.getElementById(`cell-${r}-${c}`);
            el.className = 'cell revealed rounded-lg flex items-center justify-center font-bold text-lg';
            
            if (board[r][c].neighborCount > 0) {
                el.innerText = board[r][c].neighborCount;
                el.classList.add(`number-${board[r][c].neighborCount}`);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(r + dr, c + dc);
                    }
                }
            }
        }

        function toggleFlag(r, c) {
            if (!gameActive || board[r][c].revealed) return;
            board[r][c].flagged = !board[r][c].flagged;
            const el = document.getElementById(`cell-${r}-${c}`);
            el.innerText = board[r][c].flagged ? '🚩' : '';
            sounds.click();
            
            let flags = 0;
            board.flat().forEach(cell => { if(cell.flagged) flags++; });
            document.getElementById('mine-count').innerText = Math.max(0, MINE_COUNT - flags);
        }

        function useHint() {
            if (!gameActive || hintsLeft <= 0) return;

            const hiddenSafeCells = board.flat().filter(c => !c.isMine && !c.revealed);
            if (hiddenSafeCells.length > 0) {
                const hintCell = hiddenSafeCells[Math.floor(Math.random() * hiddenSafeCells.length)];
                handleCellClick(hintCell.r, hintCell.c);
                hintsLeft--;
                document.getElementById('hint-count').innerText = hintsLeft;
                sounds.hint();
                setCheer("킁킁... 여긴 안전해! 멍멍! 🐾");
            }
        }

        function gameOver(isWin) {
            gameActive = false;
            clearInterval(timerInterval);
            
            const modal = document.getElementById('modal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');

            if (isWin) {
                sounds.win();
                icon.innerText = "🦴";
                title.innerText = "개껌 득템!";
                msg.innerText = `대단해! 풀밭을 완벽하게 탐험했어!\n기록: ${timer}초`;
                setCheer("멍멍멍! 너 정말 최고야! 꼬리 살랑살랑!");
                modal.classList.remove('hidden');
            } else {
                sounds.mine();
                setCheer("앗! 화난 친구를 깨웠어! 3초만 기다려줘...");
                
                // Show all mines as angry faces immediately
                board.flat().forEach(cell => {
                    if (cell.isMine) {
                        const el = document.getElementById(`cell-${cell.r}-${cell.c}`);
                        el.className = 'cell revealed mine rounded-lg flex items-center justify-center text-lg';
                        el.innerText = '😡';
                    }
                });

                // Show modal after 3 seconds
                setTimeout(() => {
                    if (gameActive) return; 
                    icon.innerText = "🐕💨";
                    title.innerText = "도망쳐!";
                    msg.innerText = "화난 친구를 만났어...\n하지만 강아지는 포기하지 않아!";
                    modal.classList.remove('hidden');
                }, 3000);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
