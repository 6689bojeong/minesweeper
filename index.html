<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 지뢰찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
        }
        .cell {
            width: 32px;
            height: 32px;
            transition: all 0.2s;
        }
        .cell.unrevealed {
            background-color: #333333;
            border: 2px solid #444444;
        }
        .cell.unrevealed:hover {
            background-color: #555555;
            cursor: pointer;
        }
        .cell.revealed {
            background-color: #1a1a1a;
            border: 1px solid #333333;
        }
        .cell.mine {
            background-color: #ff4d4d !important;
            animation: pop 0.3s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .number-1 { color: #3b82f6; }
        .number-2 { color: #10b981; }
        .number-3 { color: #ef4444; }
        .number-4 { color: #8b5cf6; }
        .number-5 { color: #f59e0b; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .character-bounce {
            animation: bounce 2s infinite ease-in-out;
        }
        
        .modal {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header & Character -->
    <div class="flex flex-col items-center mb-6">
        <div class="text-6xl mb-2 character-bounce">🐱</div>
        <div id="cheer-bubble" class="bg-white text-black px-4 py-2 rounded-2xl relative mb-4 font-bold text-sm">
            안녕! 내가 도와줄게! 지뢰를 다 찾아보자!
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-white"></div>
        </div>
        <h1 class="text-3xl font-black text-yellow-400 mb-2">SMILE MINESWEEPER</h1>
    </div>

    <!-- Stats Bar -->
    <div class="flex gap-6 mb-4 bg-gray-800 p-4 rounded-xl border border-gray-700 w-full max-w-md justify-around shadow-lg">
        <div class="text-center">
            <p class="text-xs text-gray-400">남은 지뢰</p>
            <p id="mine-count" class="text-xl font-bold text-red-400">10</p>
        </div>
        <div class="text-center">
            <p class="text-xs text-gray-400">시간</p>
            <p id="timer" class="text-xl font-bold">000</p>
        </div>
        <div class="text-center">
            <p class="text-xs text-gray-400">남은 힌트</p>
            <p id="hint-count" class="text-xl font-bold text-blue-400">5</p>
        </div>
    </div>

    <!-- Game Board -->
    <div id="board" class="grid gap-1 p-2 bg-gray-900 border-4 border-gray-700 rounded-lg shadow-2xl"></div>

    <!-- Controls -->
    <div class="mt-8 flex gap-4">
        <button onclick="useHint()" id="hint-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all active:scale-95">
            🔍 힌트 사용
        </button>
        <button onclick="initGame()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-6 py-3 rounded-full font-bold shadow-lg transition-all active:scale-95">
            🔄 다시 시작
        </button>
    </div>

    <!-- Game Over Modal -->
    <div id="modal" class="hidden fixed inset-0 modal flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-3xl border-2 border-yellow-500 text-center max-w-sm mx-4">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h2 id="modal-title" class="text-3xl font-bold mb-4">결과</h2>
            <p id="modal-msg" class="text-gray-300 mb-6"></p>
            <button onclick="initGame()" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl hover:bg-yellow-400 transition-colors">
                다시 도전하기
            </button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        const MINE_COUNT = 10;
        let board = [];
        let revealedCount = 0;
        let hintsLeft = 5;
        let timer = 0;
        let timerInterval;
        let gameActive = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playTone(800, 'sine', 0.1),
            reveal: () => playTone(1200, 'sine', 0.05),
            mine: () => {
                playTone(200, 'sawtooth', 0.5);
                playTone(100, 'sawtooth', 0.5);
            },
            win: () => {
                [523, 659, 783, 1046].forEach((f, i) => {
                    setTimeout(() => playTone(f, 'square', 0.2), i * 100);
                });
            },
            hint: () => playTone(900, 'triangle', 0.3)
        };

        const cheerMessages = [
            "할 수 있어! 힘내!",
            "오! 방금 건 대단했어!",
            "지뢰가 어디 숨었을까?",
            "거의 다 왔어! 조금만 더!",
            "조심해, 여긴 위험해 보여!",
            "와우! 넌 천재야!",
            "힌트가 필요하면 말해줘!"
        ];

        function setCheer(msg) {
            const bubble = document.getElementById('cheer-bubble');
            bubble.innerText = msg;
        }

        function initGame() {
            clearInterval(timerInterval);
            gameActive = true;
            revealedCount = 0;
            hintsLeft = 5;
            timer = 0;
            board = [];
            
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('timer').innerText = "000";
            document.getElementById('hint-count').innerText = hintsLeft;
            document.getElementById('mine-count').innerText = MINE_COUNT;
            setCheer("새로운 게임 시작! 가보자고!");

            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.innerHTML = '';

            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    board[r][c] = {
                        r, c,
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        neighborCount: 0
                    };
                    const cellEl = document.createElement('div');
                    cellEl.id = `cell-${r}-${c}`;
                    cellEl.className = 'cell unrevealed rounded-md flex items-center justify-center font-bold text-lg';
                    cellEl.onclick = () => handleCellClick(r, c);
                    cellEl.oncontextmenu = (e) => {
                        e.preventDefault();
                        toggleFlag(r, c);
                    };
                    boardEl.appendChild(cellEl);
                }
            }

            let minesPlaced = 0;
            while (minesPlaced < MINE_COUNT) {
                let r = Math.floor(Math.random() * BOARD_SIZE);
                let c = Math.floor(Math.random() * BOARD_SIZE);
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborCount = count;
                }
            }

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer.toString().padStart(3, '0');
                if(timer % 15 === 0) setCheer(cheerMessages[Math.floor(Math.random() * cheerMessages.length)]);
            }, 1000);
        }

        function handleCellClick(r, c) {
            if (!gameActive || board[r][c].revealed || board[r][c].flagged) return;

            if (board[r][c].isMine) {
                gameOver(false);
                return;
            }

            revealCell(r, c);
            sounds.reveal();

            if (revealedCount === BOARD_SIZE * BOARD_SIZE - MINE_COUNT) {
                gameOver(true);
            }
        }

        function revealCell(r, c) {
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE || board[r][c].revealed || board[r][c].flagged) return;

            board[r][c].revealed = true;
            revealedCount++;
            const el = document.getElementById(`cell-${r}-${c}`);
            el.className = 'cell revealed rounded-md flex items-center justify-center font-bold text-lg';
            
            if (board[r][c].neighborCount > 0) {
                el.innerText = board[r][c].neighborCount;
                el.classList.add(`number-${board[r][c].neighborCount}`);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(r + dr, c + dc);
                    }
                }
            }
        }

        function toggleFlag(r, c) {
            if (!gameActive || board[r][c].revealed) return;
            board[r][c].flagged = !board[r][c].flagged;
            const el = document.getElementById(`cell-${r}-${c}`);
            el.innerText = board[r][c].flagged ? '🚩' : '';
            sounds.click();
            
            let flags = 0;
            board.flat().forEach(cell => { if(cell.flagged) flags++; });
            document.getElementById('mine-count').innerText = Math.max(0, MINE_COUNT - flags);
        }

        function useHint() {
            if (!gameActive || hintsLeft <= 0) return;

            const hiddenSafeCells = board.flat().filter(c => !c.isMine && !c.revealed);
            if (hiddenSafeCells.length > 0) {
                const hintCell = hiddenSafeCells[Math.floor(Math.random() * hiddenSafeCells.length)];
                handleCellClick(hintCell.r, hintCell.c);
                hintsLeft--;
                document.getElementById('hint-count').innerText = hintsLeft;
                sounds.hint();
                setCheer("자, 여기 안전한 곳 하나 알려줄게! 😊");
            }
        }

        function gameOver(isWin) {
            gameActive = false;
            clearInterval(timerInterval);
            
            const modal = document.getElementById('modal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');

            if (isWin) {
                sounds.win();
                icon.innerText = "🏆";
                title.innerText = "대성공!";
                msg.innerText = `축하해! 모든 지뢰(웃음)를 찾아냈어!\n기록: ${timer}초`;
                setCheer("역시 넌 최고야! 내가 그럴 줄 알았어!");
                modal.classList.remove('hidden');
            } else {
                sounds.mine();
                setCheer("앗... 지뢰를 찾아버렸네! 3초 뒤에 알려줄게!");
                
                // Show all mines immediately
                board.flat().forEach(cell => {
                    if (cell.isMine) {
                        const el = document.getElementById(`cell-${cell.r}-${cell.c}`);
                        el.className = 'cell revealed mine rounded-md flex items-center justify-center text-lg';
                        el.innerText = '😊';
                    }
                });

                // Show modal after 3 seconds
                setTimeout(() => {
                    if (gameActive) return; // Prevent if game restarted during delay
                    icon.innerText = "💥";
                    title.innerText = "이런!";
                    msg.innerText = "지뢰를 밟아버렸어... 하지만 다시 하면 돼!";
                    modal.classList.remove('hidden');
                }, 3000);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
